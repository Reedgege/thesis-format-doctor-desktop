name: AppImage probe

# 临时探针：只跑 Linux，验证 manylinux_2_28 容器里能否产出可用的 .AppImage。
#
# 读数通道：job 日志要鉴权（匿名 403），job summary 也不会进 check-run 的 output，
# 所以结论一律用 ::notice:: 推成注解 —— check-runs/{id}/annotations 匿名可读。
# 每条注解必须单行，上限 10 条/step。
# 验证完即删除本文件。

on:
  push:
    branches: [appimage-probe]
  workflow_dispatch:

jobs:
  linux:
    name: Linux AppImage (manylinux_2_28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage in manylinux_2_28
        id: build
        shell: bash
        run: |
          set +e
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/src" -w /src \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash /src/tools/build_linux_manylinux.sh 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "container_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            n=0
            tail -60 /tmp/build.log | while IFS= read -r line; do
              line="${line//$'\r'/}"
              [ -z "$line" ] && continue
              n=$((n+1))
              [ "$n" -gt 10 ] && break
              echo "::notice title=BUILD-FAIL::$line"
            done
            exit 1
          fi
          # 成功也留 3 条关键行，方便核对到底做了哪些事
          grep -E '构建完成|AppImage|magic=|主程序|移除' /tmp/build.log | tail -6 | while IFS= read -r line; do
            line="${line//$'\r'/}"
            echo "::notice title=BUILD::$line"
          done

      - name: Inspect AppImage
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          AI="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          echo "AI=$AI"
          stat -c 'size=%s' "$AI"
          sha256sum "$AI"
          echo "magic=$(od -An -tx1 -j8 -N3 "$AI" | tr -d ' \n')"
          echo "::notice title=AI-1::file=$(basename "$AI") bytes=$(stat -c %s "$AI") magic=$(od -An -tx1 -j8 -N3 "$AI" | tr -d ' \n')"
          echo "::notice title=AI-2::sha256=$(sha256sum "$AI" | cut -d' ' -f1)"
          GL="$(python3 tools/check_glibc_linux.py dist/MDF-Stu --max 2.28 2>&1 | grep -E 'ELF 数|通过|::error' | tr '\n' ' ')"
          echo "glibc: $GL"
          echo "::notice title=AI-3::glibc $GL"

      - name: Extract & smoke (no FUSE)
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          set -e
          AI="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          rm -rf squashfs-root
          # --appimage-extract 由 runtime 内部解 squashfs，不需要 FUSE —— 这一步同时证明
          # runtime 本身能在没有 libfuse 的环境里工作。
          set +e
          "$AI" --appimage-extract > /tmp/extract.log 2>&1
          echo "extract_rc=$?"
          set -e
          TOP="$(ls -A squashfs-root 2>/dev/null | tr '\n' ',')"
          echo "top=$TOP"
          echo "::notice title=EX-1::extract_rc ok  top=$TOP"
          DESK="$(cat squashfs-root/*.desktop 2>/dev/null | tr '\n' '|')"
          echo "desktop=$DESK"
          echo "::notice title=EX-2::desktop $DESK"
          APPRUN="$(test -x squashfs-root/AppRun && echo yes || echo no)"
          echo "::notice title=EX-3::AppRun_executable=$APPRUN  usrbin=$(ls -A squashfs-root/usr/bin 2>/dev/null | tr '\n' ',')"
          BIN="$(find squashfs-root/usr/bin -maxdepth 2 -type f -perm -u+x ! -name '*.so*' | sed -n '1p')"
          echo "BIN=$BIN"
          echo "::notice title=EX-4::BIN=$BIN  size=$(stat -c %s "$BIN" 2>/dev/null)"
          # 注意末尾的 || true：grep 无匹配时退出码 1，在 set -e 下整个赋值会失败
          MISS="$(ldd "$BIN" 2>&1 | grep -i 'not found' | tr '\n' ' ' || true)"
          echo "missing=$MISS"
          echo "::notice title=EX-5::ldd_missing=${MISS:-无}"
          RES="$(find squashfs-root \( -name 'icon.icns' -o -name 'icon.ico' \) -print | tr '\n' ' ' || true)"
          echo "residual_icons=$RES"
          echo "::notice title=EX-6::残留图标=${RES:-无（已清干净）}"
          echo "::notice title=EX-7::payload_files=$(find squashfs-root/usr/bin -type f | wc -l)  payload_du=$(du -sh squashfs-root/usr/bin | cut -f1)"
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y xvfb >/dev/null 2>&1) || true
          if command -v xvfb-run >/dev/null; then
            set +e
            timeout 20 xvfb-run -a ./squashfs-root/AppRun > /tmp/run.log 2>&1
            RE=$?
            set -e
            echo "run_exit=$RE"
            TAIL="$(tail -6 /tmp/run.log | tr '\n' '|' | cut -c1-200)"
            echo "::notice title=EX-8::AppRun 试跑 exit=$RE (124=活着被超时杀掉)  log=$TAIL"
          else
            echo "::notice title=EX-8::无 xvfb，跳过启动测试"
          fi
