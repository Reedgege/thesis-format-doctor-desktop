name: Build Desktop (Win/macOS/Linux)

# 运行名称：打标签推送 → 显示标签名（如 v1.3.21）；
# 推 main → 显示推送提交的第一行；Actions 列表里一眼找到对应版本。
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  # 仅打 v* 标签推送时才构建并发布。发版流程：本地 bump VERSION → git tag vX.Y.Z → git push origin vX.Y.Z。
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            ext: ".exe"
          - os: macos
            runner: macos-latest
            ext: ""
          - os: linux
            runner: ubuntu-latest
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # v1.3.103：改用 Nuitka 编译（替代 PyInstaller）。Nuitka 把 Python 编译成原生
      # 机器码，产物在 Defender 眼里等同普通 C++ 程序，报毒率极低（实测 2/71），
      # 且源码被编译保护。Python 3.12 由 setup-python 提供，编译器由 runner 自带
      # （Windows: MSVC / macOS: clang / Linux: gcc），无需额外安装。
      - name: Install Nuitka
        run: python -m pip install --upgrade pip nuitka

      - name: Install pywin32 (Windows only, in-process Word/WPS .doc conversion)
        if: matrix.os == 'windows'
        run: python -m pip install pywin32

      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl zip

      # macOS 需要 .icns 作为 app 图标（PNG→ICNS 用 Pillow）。
      - name: Generate icon.icns (macOS only)
        if: matrix.os == 'macos'
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('tfd_app/assets/icon.png').save('tfd_app/assets/icon.icns', format='ICNS', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          ls -la tfd_app/assets/icon.icns

      # Nuitka 编译为 standalone 文件夹（运行时不自解压，规避 dropper 指纹）。
      - name: Build (${{ matrix.os }})
        if: matrix.os != 'linux'
        shell: bash
        run: python build.py

      # Linux 必须在 manylinux_2_28（AlmaLinux 8 / glibc 2.28）容器里构建。
      # 为什么：GitHub 的 ubuntu-latest 已迁到 Ubuntu 26（glibc 2.42），在那儿编出来的
      # 包会硬要求 GLIBC_2.42 —— Ubuntu 24.04 LTS（2.39）都装不上，客户只会看到
      # "GLIBC_2.42 not found"。glibc 只能向下兼容，所以只能在老环境里编。
      - name: Build (Linux, manylinux_2_28)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          # 不能用纯 `docker run ... | tee`：Actions 的 bash 带 -e，管道一失败脚本立刻
          # 退出，下面把日志转注解的代码就不会执行 —— 结果 CI 只说挂了、不说是为什么。
          set +e
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD:/src" -w /src \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash /src/tools/build_linux_manylinux.sh 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "容器退出码 = $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::manylinux 容器内构建失败 rc=$rc，下面是日志最后 8 行"
            tail -8 /tmp/build.log | while IFS= read -r line; do
              line="${line//$'\r'/}"
              [ -z "$line" ] && continue
              echo "::error::${line:0:250}"
            done
            exit 1
          fi


      # Windows zip 主推分发（纯绿色版）：只生成「使用说明.txt」。
      # 桌面快捷方式由软件自身创建（win32com 已内置 exe，客户零依赖、零黑框；
      # 首次启动自动静默创建一次；顶栏“桌面图标”可随时手动补建）。
      # v1.3.109：产物目录/主程序已中文化——dist 目录即 zip 顶层文件夹
      # （文档格式先生（免安装版）），主程序 1.文档格式先生.exe 数字前缀排最前。
      # 注意：本脚本输出必须 ASCII-safe——GitHub Windows runner 控制台是 cp1252，
      # 打印中文文件名会 UnicodeEncodeError（v1.3.107 CI 曾因此崩溃）。
      - name: Generate portable install assets (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          python tools/make_portable_assets.py --dist "dist\文档格式先生（免安装版）" --exe "1.文档格式先生.exe" --install-sub "ThesisFormatDoctor" --product "文档格式先生"

      # Windows：用 NSIS 把 standalone 文件夹打成单个安装器 exe（用户双击安装、得一个图标）。
      # 2026-09-16 修复：choco 社区源在 GitHub runner 上偶发不可达，导致 makensis 缺失、
      # 安装包步骤偶发失败。改为「官方包直下（确定性）+ choco 兜底 + 重试」。
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisDir\makensis.exe") { Write-Host "NSIS already present"; exit 0 }
          $ok = $false
          # 主方案：直接下载官方 NSIS 便携包（规避 choco 社区源偶发不可达）
          try {
            $zip = "$env:TEMP\nsis.zip"
            for ($a = 1; $a -le 3; $a++) {
              try { Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip" -OutFile $zip -TimeoutSec 180; break }
              catch { Start-Sleep -Seconds 8 }
            }
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\nsis_ext" -Force
            $mk = Get-ChildItem "$env:TEMP\nsis_ext" -Recurse -Filter "makensis.exe" | Select-Object -First 1
            if ($mk) {
              New-Item -ItemType Directory -Force -Path $nsisDir | Out-Null
              Copy-Item "$($mk.Directory.FullName)\*" $nsisDir -Recurse -Force
              $ok = $true
            }
          } catch { Write-Host "direct download failed: $_" }
          # 兜底：choco
          if (-not $ok) {
            for ($i = 1; $i -le 3; $i++) {
              try { choco install nsis -y --no-progress; if (Test-Path "$nsisDir\makensis.exe") { $ok = $true; break } }
              catch { Start-Sleep -Seconds 8 }
            }
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) { throw "NSIS 安装失败" }
          & "$nsisDir\makensis.exe" /VERSION

      # 注意：此步骤必须用 pwsh 而非 bash。Git Bash(MSYS) 会把 /DVERSION=...
      # 误当成路径转换成 C:/Program Files/Git/DVERSION=...，导致 makensis 找不到脚本。
      # PowerShell 不做该转换，/DVERSION= 原样传参。
      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = (Get-Content VERSION).Trim()
          $VERNUM = $VER -replace '^v',''      # NSIS VIProductVersion 只收纯数字
          $MAKENSIS = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $MAKENSIS)) { $MAKENSIS = "makensis" }
          & $MAKENSIS /DVERSION=$VER /DVERNUM=$VERNUM installer.nsi
          ls MDF-Stu-setup.exe

      # Windows 双轨分发：除了 setup.exe 安装包，再打一个"文件夹 zip"作为主推分发
      # （解压后的主程序 exe 已实测 VirusTotal 0 报；安装包外壳偶被 Defender ML 误报）。
      # Windows runner 没有 zip 命令，用 PowerShell 的 Compress-Archive。
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\文档格式先生（免安装版）\*" -DestinationPath "release\MDF-Stu-windows.zip" -Force
          ls release

      # macOS 分发：修正 .app 元数据 → 重新 ad-hoc 签名 → zip（必须带 .app 这一层）+ dmg。
      #
      # 🔴 2026-11-14 修的两个致命问题（v1.3.158 及以前所有 macOS 包都中招）：
      #   ① `ditto -c -k` 不带 --keepParent 时只打包**目录里的内容**，zip 顶层变成
      #      `Contents/`，客户解压得到的是一个叫 Contents 的普通文件夹，双击毫无反应，
      #      macOS 根本不认成应用 —— 等于 macOS 版一直不可用。
      #   ② Nuitka 默认把 CFBundleIdentifier 填成中文（"文档格式先生"）、
      #      CFBundleShortVersionString 写死 1.0，Finder 里版本不对，也不合 Apple 规范。
      #
      # 改 Info.plist 会让 Nuitka 原先的 ad-hoc 签名失效；而 Apple Silicon 强制要求
      # 所有可执行文件至少有 ad-hoc 签名，否则直接拒绝启动 —— 所以改完必须重签。
      - name: Package (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/MDF-Stu.app"
          PLIST="$APP/Contents/Info.plist"
          VER="$(cat VERSION | tr -d '[:space:]' | sed 's/^v//')"
          echo "打包版本：$VER"

          plist_set() {  # 存在则 Set，不存在则 Add
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          plist_set CFBundleIdentifier      "com.reedskill.mdfstu"
          plist_set CFBundleShortVersionString "$VER"
          plist_set CFBundleVersion         "$VER"
          plist_set LSMinimumSystemVersion  "11.0"
          plist_set CFBundleDisplayName     "文档格式先生"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

          # 改过 plist → 原 ad-hoc 签名失效（签名覆盖 Info.plist 的哈希）。
          # 先删旧签名目录再重签，避免残留的 _CodeSignature 与 CodeResources 打架。
          # 不重签的话 Apple Silicon 会直接拒绝启动（它强制要求至少 ad-hoc 签名）。
          rm -rf "$APP/Contents/_CodeSignature"
          codesign --force --deep --sign - "$APP" || codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP" 2>&1 | head -10 || true

          mkdir -p release
          # zip：--keepParent 保住 MDF-Stu.app 这一层
          ditto -c -k --keepParent -v "$APP" "release/MDF-Stu-macos.zip"
          # 自检：zip 顶层必须恰好是 MDF-Stu.app，否则客户解压出来还是废的
          python3 - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile("release/MDF-Stu-macos.zip")
          tops = sorted({n.split("/")[0] for n in z.namelist()})
          print("zip 顶层条目:", tops)
          if tops != ["MDF-Stu.app"]:
              print("!! zip 顶层不是 MDF-Stu.app，客户解压后双击无效")
              sys.exit(1)
          print("OK 顶层正确")
          PY

          # dmg：拖拽式安装盘（.app + 指向 /Applications 的软链 + 首次打开说明）
          STAGE="dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cat > "$STAGE/首次打开必读.txt" <<'TXT'
          文档格式先生 · macOS 版
          ================================

          【安装】
            1. 把左边的「文档格式先生.app」拖到右边的 Applications 文件夹
            2. 打开「应用程序」文件夹，双击「文档格式先生」

          【第一次打开被系统拦住？】

            苹果对未经公证的软件默认拦截，提示"无法验证开发者"或"已损坏"。
            这不是文件坏了，按下面操作一次，以后就正常了：

            macOS 15 (Sequoia) 及以上：
              打开「系统设置」→「隐私与安全性」，往下拉到「安全性」一栏，
              会看到「已阻止使用"文档格式先生"」，点右边的「仍要打开」，
              输入开机密码即可。

            macOS 14 (Sonoma) 及以下：
              在应用图标上右键 →「打开」→ 弹窗里再点一次「打开」。

          【支持的系统】
            macOS 11.0 (Big Sur) 及以上
            仅支持 Apple Silicon 芯片（M1 / M2 / M3 / M4）
            Intel 芯片的 Mac 暂不支持，需要请联系 hi@reedskill.com

          【遇到问题】
            邮箱：hi@reedskill.com
            官网：https://reedskill.com
          TXT

          hdiutil create -volname "文档格式先生" -srcfolder "$STAGE" \
            -ov -format UDZO "release/MDF-Stu-macos.dmg"
          ls -la release/
          # 自检：dmg 能挂载且里面有 .app
          hdiutil attach "release/MDF-Stu-macos.dmg" -nobrowse -readonly -mountpoint /tmp/dmgchk
          test -d "/tmp/dmgchk/MDF-Stu.app" && echo "OK dmg 内含 MDF-Stu.app"
          test -f "/tmp/dmgchk/首次打开必读.txt" && echo "OK dmg 内含使用说明"
          hdiutil detach /tmp/dmgchk -force

      # Linux 只交付一个 .AppImage：单文件，客户 chmod +x 之后双击/直接运行即可 ——
      # 不用解压、不用进目录找主程序、不用额外装 libfuse2（官方 type2 runtime 静态
      # 链接了 FUSE）。真正的打包在 manylinux 容器里完成（见上一步脚本末段），
      # 这里只做体检 + 改成发布名。
      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p release
          APPIMAGE="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "::error::dist/ 里没有 .AppImage —— 容器里的打包步骤没成功"
            ls -la dist/ || true
            exit 1
          fi
          echo "AppImage: $APPIMAGE"
          # 把「客户机器能不能跑」变成 CI 断言：glibc 需求超过 2.28 直接红灯。
          # 查的是解包后的 payload 目录（squashfs 里的 ELF 与 dist/MDF-Stu 同一批文件）。
          python3 tools/check_glibc_linux.py dist/MDF-Stu --max 2.28
          cp "$APPIMAGE" release/MDF-Stu-linux.AppImage
          chmod +x release/MDF-Stu-linux.AppImage

          # 同时出一个 .deb：客户双击安装、菜单里点图标，不碰终端、不依赖 FUSE。
          # 为什么必须有它：AppImage 在客户侧要 chmod、部分发行版还缺 fusermount，
          # 这两件事都会表现成「双击一点反应都没有」。
          bash tools/make_deb.sh
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          [ -n "$DEB" ] || { echo "::error::dist/ 里没有生成 .deb"; exit 1; }
          cp "$DEB" release/MDF-Stu-linux.deb
          ls -la release/

      # 客户视角全链路：把 .deb 真装到系统里 → 确认菜单项和主程序就位 → 真启动一次。
      # 「构建成功」不等于「客户能用」，这一步才是验收。
      - name: Smoke test (install .deb and launch)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null 2>&1) || true
          sudo dpkg -i release/MDF-Stu-linux.deb
          test -f /usr/share/applications/mdf-stu.desktop && echo "OK 菜单项已就位"
          test -x /opt/mdf-stu/MDF-Stu && echo "OK 主程序已就位（755）"
          set +e
          timeout 25 xvfb-run -a /opt/mdf-stu/MDF-Stu > /tmp/smoke.log 2>&1
          rc=$?
          set -e
          echo "启动退出码 = $rc（124 = 活着被超时杀掉 = 启动成功）"
          if [ "$rc" -ne 124 ]; then
            echo "::error::deb 安装后启动失败 rc=$rc"
            tail -20 /tmp/smoke.log || true
            exit 1
          fi
          echo "OK deb 安装后能正常启动，卸载测试"
          sudo dpkg -r mdf-stu
          test ! -e /opt/mdf-stu && echo "OK 卸载干净"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDF-Stu-${{ matrix.os }}
          path: |
            MDF-Stu-setup.exe
            release/MDF-Stu-windows.zip
            release/MDF-Stu-macos.zip
            release/MDF-Stu-macos.dmg
            release/MDF-Stu-linux.AppImage
            release/MDF-Stu-linux.deb
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    # 只在打 tag 时发布：workflow_dispatch 仅构建 + 上传 artifact。
    # 否则手动构建会把「未发版的产物」写到已发布版本的 Release 上（tag 与产物错配）。
    if: needs.build.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          for plat in windows macos linux; do
            find "artifacts/MDF-Stu-$plat" -type f | while read f; do
              cp "$f" "release/$(basename "$f")"
            done
          done
          ls -la release

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(cat VERSION | tr -d '[:space:]')"
            [ -z "$version" ] && version="latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true

      # Release 资产已挂好，本次 run 的构件当场回收。
      # 为什么必须回收：构件只是「跨 job 传包」的中转（Release 资产不占 Actions 的
      # 500MB artifact 配额），但默认仍会留到过期。同一天连打多个 tag 时，多个 run
      # 的构件同时在场会把配额撑爆 → 下次 upload-artifact 直接报
      # "Artifact storage quota has been hit"，整个 Release 发不出来。
      - name: Recycle artifacts (Release 已有资产)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "recycled artifact $id"
          done
          left=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.total_count' 2>/dev/null || echo '?')
          echo "artifacts left in this run: $left"
