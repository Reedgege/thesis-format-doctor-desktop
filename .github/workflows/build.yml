name: Build Desktop (Win/macOS/Linux)

# 运行名称：打标签推送 → 显示标签名（如 v1.3.21）；
# 推 main → 显示推送提交的第一行（按约定版本发布提交以 vX.Y.Z 开头，如 "v1.3.21 · …"），
# 这样在 Actions 列表里一眼就能找到对应版本，而不是光秃秃的 main。
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            sep: ";"
            ext: ".exe"
          - os: macos
            runner: macos-latest
            sep: ":"
            ext: ""
          - os: linux
            runner: ubuntu-latest
            sep: ":"
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install pywin32 (Windows only, in-process Word/WPS .doc conversion)
        if: matrix.os == 'windows'
        run: python -m pip install pywin32

      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl

      # UPX 压缩：PyInstaller 检测到 UPX 在 PATH 上会自动压缩，exe 体积约减半。
      # 注意：个别杀毒软件对 UPX 压缩包有误报，若客户反馈可删掉本步（体积换安心）。
      - name: Install UPX (Windows)
        if: matrix.os == 'windows'
        run: choco install upx -y
      - name: Install UPX (macOS)
        if: matrix.os == 'macos'
        run: brew install upx
      - name: Install UPX (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get install -y upx-ucl

      - name: Build (${{ matrix.os }})
        shell: bash
        env:
          SEP: ${{ matrix.sep }}
          EXT: ${{ matrix.ext }}
        run: |
          python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-format-doctor-desktop-${{ matrix.os }}
          path: dist/thesis-format-doctor-desktop${{ matrix.ext }}
          if-no-files-found: error

      # 卖家兜底发码工具 keygen（离线签名码生成）。仅 Windows 构建。
      # 注意：keygen.exe 内含离线签名密钥，属卖家自用，勿把 Release 设为公开、勿发给客户。
      - name: Build keygen (Windows only)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          python -m PyInstaller --name keygen --onefile --noconsole --clean \
            --collect-all tkinter \
            --add-data "tfd_app/license.py;tfd_app/license.py" \
            keygen.py

      - name: Upload keygen artifact (Windows only)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-windows
          path: dist/keygen.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          for plat in windows macos linux; do
            src=$(find "artifacts/thesis-format-doctor-desktop-$plat" -type f | head -1)
            ext=""; [ "$plat" = "windows" ] && ext=".exe"
            cp "$src" "release/thesis-format-doctor-desktop-$plat$ext"
          done
          # 卖家兜底发码工具（Windows）
          cp "$(find artifacts/keygen-windows -type f | head -1)" "release/keygen.exe"
          ls -la release

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            # 推 main 时版本号取自仓库根目录 VERSION 文件（如 v1.3.19）
            version=""
            if [ -f VERSION ]; then
              version="$(cat VERSION | tr -d '[:space:]')"
            fi
            if [ -z "$version" ]; then
              version="latest"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 打标签用标签名；推 main 用 VERSION 文件里的版本号（如 v1.3.19），保证一键 Push 也是正式版本号
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true
