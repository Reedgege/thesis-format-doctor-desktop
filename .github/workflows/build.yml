name: Build Desktop (Win/macOS/Linux)

# 运行名称：打标签推送 → 显示标签名（如 v1.3.21）；
# 推 main → 显示推送提交的第一行；Actions 列表里一眼找到对应版本。
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  # 仅打 v* 标签推送时才构建并发布。发版流程：本地 bump VERSION → git tag vX.Y.Z → git push origin vX.Y.Z。
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            ext: ".exe"
          - os: macos
            runner: macos-latest
            ext: ""
          - os: linux
            runner: ubuntu-latest
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # v1.3.103：改用 Nuitka 编译（替代 PyInstaller）。Nuitka 把 Python 编译成原生
      # 机器码，产物在 Defender 眼里等同普通 C++ 程序，报毒率极低（实测 2/71），
      # 且源码被编译保护。Python 3.12 由 setup-python 提供，编译器由 runner 自带
      # （Windows: MSVC / macOS: clang / Linux: gcc），无需额外安装。
      - name: Install Nuitka
        run: python -m pip install --upgrade pip nuitka

      - name: Install pywin32 (Windows only, in-process Word/WPS .doc conversion)
        if: matrix.os == 'windows'
        run: python -m pip install pywin32

      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl zip

      # macOS 需要 .icns 作为 app 图标（PNG→ICNS 用 Pillow）。
      - name: Generate icon.icns (macOS only)
        if: matrix.os == 'macos'
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('tfd_app/assets/icon.png').save('tfd_app/assets/icon.icns', format='ICNS', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          ls -la tfd_app/assets/icon.icns

      # Nuitka 编译为 standalone 文件夹（运行时不自解压，规避 dropper 指纹）。
      - name: Build (${{ matrix.os }})
        shell: bash
        run: python build.py

      # Windows zip 主推分发（纯绿色版）：只生成「使用说明.txt」。
      # 桌面快捷方式由软件自身创建（win32com 已内置 exe，客户零依赖、零黑框；
      # 首次启动自动静默创建一次；顶栏“桌面图标”可随时手动补建）。
      # v1.3.109：产物目录/主程序已中文化——dist 目录即 zip 顶层文件夹
      # （论文格式医生（免安装版）），主程序 1.论文格式医生.exe 数字前缀排最前。
      # 注意：本脚本输出必须 ASCII-safe——GitHub Windows runner 控制台是 cp1252，
      # 打印中文文件名会 UnicodeEncodeError（v1.3.107 CI 曾因此崩溃）。
      - name: Generate portable install assets (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          python tools/make_portable_assets.py --dist "dist\论文格式医生（免安装版）" --exe "1.论文格式医生.exe" --install-sub "ThesisFormatDoctor" --product "论文格式医生"

      # Windows：用 NSIS 把 standalone 文件夹打成单个安装器 exe（用户双击安装、得一个图标）。
      # 2026-09-16 修复：choco 社区源在 GitHub runner 上偶发不可达，导致 makensis 缺失、
      # 安装包步骤偶发失败。改为「官方包直下（确定性）+ choco 兜底 + 重试」。
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisDir\makensis.exe") { Write-Host "NSIS already present"; exit 0 }
          $ok = $false
          # 主方案：直接下载官方 NSIS 便携包（规避 choco 社区源偶发不可达）
          try {
            $zip = "$env:TEMP\nsis.zip"
            for ($a = 1; $a -le 3; $a++) {
              try { Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip" -OutFile $zip -TimeoutSec 180; break }
              catch { Start-Sleep -Seconds 8 }
            }
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\nsis_ext" -Force
            $mk = Get-ChildItem "$env:TEMP\nsis_ext" -Recurse -Filter "makensis.exe" | Select-Object -First 1
            if ($mk) {
              New-Item -ItemType Directory -Force -Path $nsisDir | Out-Null
              Copy-Item "$($mk.Directory.FullName)\*" $nsisDir -Recurse -Force
              $ok = $true
            }
          } catch { Write-Host "direct download failed: $_" }
          # 兜底：choco
          if (-not $ok) {
            for ($i = 1; $i -le 3; $i++) {
              try { choco install nsis -y --no-progress; if (Test-Path "$nsisDir\makensis.exe") { $ok = $true; break } }
              catch { Start-Sleep -Seconds 8 }
            }
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) { throw "NSIS 安装失败" }
          & "$nsisDir\makensis.exe" /VERSION

      # 注意：此步骤必须用 pwsh 而非 bash。Git Bash(MSYS) 会把 /DVERSION=...
      # 误当成路径转换成 C:/Program Files/Git/DVERSION=...，导致 makensis 找不到脚本。
      # PowerShell 不做该转换，/DVERSION= 原样传参。
      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = (Get-Content VERSION).Trim()
          $VERNUM = $VER -replace '^v',''      # NSIS VIProductVersion 只收纯数字
          $MAKENSIS = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $MAKENSIS)) { $MAKENSIS = "makensis" }
          & $MAKENSIS /DVERSION=$VER /DVERNUM=$VERNUM installer.nsi
          ls thesis-format-doctor-desktop-setup.exe

      # Windows 双轨分发：除了 setup.exe 安装包，再打一个"文件夹 zip"作为主推分发
      # （解压后的主程序 exe 已实测 VirusTotal 0 报；安装包外壳偶被 Defender ML 误报）。
      # Windows runner 没有 zip 命令，用 PowerShell 的 Compress-Archive。
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\论文格式医生（免安装版）\*" -DestinationPath "release\thesis-format-doctor-desktop-windows.zip" -Force
          ls release

      # macOS：把 .app 压缩成 zip 作为发布物。
      - name: Package (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k -v "dist/thesis-format-doctor-desktop.app" "release/thesis-format-doctor-desktop-macos.zip"

      # Linux：把 standalone 文件夹压缩成 zip。
      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cd dist && zip -r "../release/thesis-format-doctor-desktop-linux.zip" "thesis-format-doctor-desktop"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-format-doctor-desktop-${{ matrix.os }}
          path: |
            thesis-format-doctor-desktop-setup.exe
            release/thesis-format-doctor-desktop-windows.zip
            release/thesis-format-doctor-desktop-macos.zip
            release/thesis-format-doctor-desktop-linux.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    # 只在打 tag 时发布：workflow_dispatch 仅构建 + 上传 artifact。
    # 否则手动构建会把「未发版的产物」写到已发布版本的 Release 上（tag 与产物错配）。
    if: needs.build.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          for plat in windows macos linux; do
            find "artifacts/thesis-format-doctor-desktop-$plat" -type f | while read f; do
              cp "$f" "release/$(basename "$f")"
            done
          done
          ls -la release

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(cat VERSION | tr -d '[:space:]')"
            [ -z "$version" ] && version="latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true
