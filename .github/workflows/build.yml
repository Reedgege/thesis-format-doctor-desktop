name: Build Desktop (Win/macOS/Linux)

# 运行名称：打标签推送 → 显示标签名（如 v1.3.21）；
# 推 main → 显示推送提交的第一行（按约定版本发布提交以 vX.Y.Z 开头，如 "v1.3.21 · …"），
# 这样在 Actions 列表里一眼就能找到对应版本，而不是光秃秃的 main。
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  # 仅打 v* 标签推送时才构建并发布，避免每次 push main 都上传 ~250MB 三平台 exe
  # 把 Actions Artifact 免费 500MB 额度吃满（曾导致 windows 构建 Artifact quota 报错）。
  # 发版流程：本地 bump VERSION → git tag vX.Y.Z → git push origin vX.Y.Z。
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            sep: ";"
            ext: ".exe"
          - os: macos
            runner: macos-latest
            sep: ":"
            ext: ""
          - os: linux
            runner: ubuntu-latest
            sep: ":"
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: "Install PyArmor (optional: only used if PYARMOR_LICENSE secret is set)"
        run: python -m pip install pyarmor

      - name: Install pywin32 (Windows only, in-process Word/WPS .doc conversion)
        if: matrix.os == 'windows'
        run: python -m pip install pywin32

      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl

      # UPX 压缩已移除（v1.3.91，2026-09-02）：学生版 Windows 安装包被 Windows Defender
      # 误报隔离（UPX 加壳是杀软经典误报点）。去掉 UPX 后 exe 无加壳特征、哈希全新，
      # 误报概率大降；代价是体积从 ~24MB 增至 ~45MB（zip 后 ~35-45MB，可接受）。

      # v1.3.52：从 png 生成 macOS .icns（PyInstaller 嵌入 exe 资源需 .icns；PNG→ICNS 用 Pillow）。
      # 原始源图 icon.png 已是 1024x1024 透明小羽毛，能满足 16~512 多分辨率输出。
      - name: Generate icon.icns (macOS only)
        if: matrix.os == 'macos'
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('tfd_app/assets/icon.png').save('tfd_app/assets/icon.icns', format='ICNS', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          ls -la tfd_app/assets/icon.icns

      - name: Build (${{ matrix.os }})
        shell: bash
        env:
          SEP: ${{ matrix.sep }}
          EXT: ${{ matrix.ext }}
          PYARMOR_LICENSE: ${{ secrets.PYARMOR_LICENSE }}
        run: |
          python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-format-doctor-desktop-${{ matrix.os }}
          path: dist/thesis-format-doctor-desktop${{ matrix.ext }}
          if-no-files-found: error
          # 产物仅用于同一次 workflow 内 build→release 传递，Release 里的安装包才是永久分发物。
          # 保留 1 天即可，避免每轮 push 累积把 500MB 免费配额吃满（曾导致 macOS 构建上传失败）。
          retention-days: 1

      # 卖家离线发码工具 offlinecode 不进公开 Release：由卖家本地从 offlinecode.py 生成，
      # 避免杀软误报，也避免激活码签名逻辑随公开仓库泄露。

  release:
    name: Publish Release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          for plat in windows macos linux; do
            src=$(find "artifacts/thesis-format-doctor-desktop-$plat" -type f | head -1)
            ext=""; [ "$plat" = "windows" ] && ext=".exe"
            cp "$src" "release/thesis-format-doctor-desktop-$plat$ext"
          done
          ls -la release

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            # 推 main 时版本号取自仓库根目录 VERSION 文件（如 v1.3.19）
            version=""
            if [ -f VERSION ]; then
              version="$(cat VERSION | tr -d '[:space:]')"
            fi
            if [ -z "$version" ]; then
              version="latest"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 打标签用标签名；推 main 用 VERSION 文件里的版本号（如 v1.3.19），保证一键 Push 也是正式版本号
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true
