name: Build Desktop (Win/macOS/Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            sep: ";"
            ext: ".exe"
          - os: macos
            runner: macos-latest
            sep: ":"
            ext: ""
          - os: linux
            runner: ubuntu-latest
            sep: ":"
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl

      - name: Build (${{ matrix.os }})
        shell: bash
        env:
          SEP: ${{ matrix.sep }}
          EXT: ${{ matrix.ext }}
        run: |
          python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-format-doctor-desktop-${{ matrix.os }}
          path: dist/thesis-format-doctor-desktop${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          for plat in windows macos linux; do
            src=$(find "artifacts/thesis-format-doctor-desktop-$plat" -type f | head -1)
            ext=""; [ "$plat" = "windows" ] && ext=".exe"
            cp "$src" "release/thesis-format-doctor-desktop-$plat$ext"
          done
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
