<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>论文格式医生 · 桌面版</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">格</span>
      <div class="brand-text">
        <h1>论文格式医生</h1>
        <p>桌面版 · 纯本地离线运行 · 源自扣子 skill thesis-format-doctor</p>
      </div>
    </div>
    <div class="badge" id="engineBadge">引擎加载中…</div>
  </header>

  <main class="layout">
    <!-- 左侧：上传 + 操作 -->
    <section class="panel">
      <h2 class="panel-title">1 · 选择文件</h2>

      <label class="drop" id="dropThesis">
        <input type="file" id="fileThesis" accept=".docx" hidden />
        <div class="drop-inner">
          <strong>待处理论文 .docx</strong>
          <span id="thesisName" class="muted">点击或拖入文件（必选）</span>
        </div>
      </label>

      <label class="drop alt" id="dropTemplate">
        <input type="file" id="fileTemplate" accept=".docx" hidden />
        <div class="drop-inner">
          <strong>学校模板 .docx（可选）</strong>
          <span id="templateName" class="muted">用于"模板驱动诊断/套用"，更精确</span>
        </div>
      </label>

      <div class="profile-box" id="profileBox" hidden>
        <span class="dot"></span>
        <span id="profileInfo">已载入格式画像，将自动用于诊断与修正</span>
        <button class="link" id="clearProfile" type="button">清除</button>
      </div>

      <h2 class="panel-title">2 · 执行操作</h2>
      <div class="actions">
        <button class="btn primary" id="btnCheck" type="button">🩺 格式体检</button>
        <button class="btn" id="btnFix" type="button">🎯 套标题 &amp; 出目录</button>
        <button class="btn" id="btnRef" type="button">📚 重排参考文献</button>
        <button class="btn ghost" id="btnProfile" type="button">📐 抽取模板画像</button>
      </div>

      <p class="hint">
        提示：先"抽取模板画像"，后续体检/套用会自动带上它，结果更贴合学校要求。
      </p>
    </section>

    <!-- 右侧：结果 -->
    <section class="panel result">
      <h2 class="panel-title">运行结果</h2>
      <div id="status" class="status idle">等待操作…</div>
      <div id="output"></div>
    </section>
  </main>

  <footer class="footer">
    论文格式医生 · 桌面版 — 完全离线，文件不会上传任何服务器
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
